[package]
name = "cctts"
version = "0.1.0"
description = "Claude Code wrapper with TTS, avatar, and compose overlay"
authors = ["Amir Amashe"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "cctts"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
portable-pty = "0.8"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
base64 = "0.22"
which = "6"
vte = "0.13"
shlex = "1"
uuid = { version = "1", features = ["v4"] }

# TTS (Kokoro via ONNX Runtime). misaki-rs default features include espeak-ng
# fallback for OOV words; the resulting binary is GPLv3 (see NOTICE).
misaki-rs = "0.3"
ort = { version = "=2.0.0-rc.11", features = ["download-binaries", "cuda"] }
ndarray = "0.16"
bytemuck = "1"

# Audio output
cpal = "0.15"
rodio = "0.20"

# Filesystem paths
dirs = "5"

# Windows-only: registry probe for Git Bash auto-detection in shell::detect.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
