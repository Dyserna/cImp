[package]
name = "cctts"
version = "0.1.0"
description = "Claude Code wrapper with TTS, avatar, and compose overlay"
authors = ["Amir Amashe"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "cctts"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
portable-pty = "0.8"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
which = "6"
vte = "0.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
