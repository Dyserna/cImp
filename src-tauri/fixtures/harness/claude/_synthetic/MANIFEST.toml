# V35 Phase C — provenance for the Claude Code NEGATIVE canary fixtures here.
#
# `_synthetic/` is not a version directory: it holds drift MODELS, one per
# covered capability, each a byte-for-byte copy of the fixture in
# `models_version` with exactly ONE load-bearing field renamed. It carries a
# manifest for the same reason every version directory does — the rule stays
# uniform, so `_synthetic` cannot become the hole where undated fixtures
# accumulate. `harness::canary::every_fixture_version_dir_has_a_manifest`
# checks the same four keys here as everywhere else, PLUS the fifth key below,
# which only a `_synthetic` directory carries.
#
# Files here, the capability each models drifting, and the field renamed:
#   usage-renamed-input-tokens.jsonl        claude.transcript.usage
#       message.usage.input_tokens -> inputTokens
#       degraded default: `parse_usage_line`'s `unwrap_or(0)` yields in_tok = 0
#   tool-result-renamed-tool-use-id.jsonl   claude.transcript.tool_result
#       message.content[].tool_use_id -> toolUseId
#       degraded default: `extract_tool_results` skips the block; empty Vec
#   assistant-text-renamed-text.jsonl       claude.transcript.assistant_text
#       message.content[].text -> body (on both text blocks)
#       degraded default: `assistant_texts` skips the block; empty Vec, and the
#       tab simply goes mute on any tab with no `Stop` push (V35 Phase L)
#   stop-reason-renamed.jsonl               claude.transcript.stop_reason
#       message.stop_reason -> stopReason (on both lines)
#       degraded default: `is_turn_end` answers false for EVERY line, so the
#       fallback reader never files a delegation completion and the driver
#       waits out its whole deadline for a turn that ended minutes ago
#   statusline-renamed-context-window.json  claude.statusline.stdin
#       context_window -> contextWindow (the whole block; live-verify recipe 3)
#       degraded default: `extract_context` -> None, blank context bar, and a
#       push that still looks healthy because `rate_limits` survived
#
# Every negative fixture must stay otherwise IDENTICAL to its positive twin:
# the negative canary asserts that the untouched fields are still substantive,
# so a second accidental difference would make the test prove nothing.

