name: Tests

# Test gate for both halves of the app (code review 2026-08-05, M19b). Before
# this workflow existed NO CI job ran a test: every tripwire in the suite —
# `preview::capture::lock_pins`, the osv-source pin, the `--settings` overlay
# contract, the patterns/default-set snapshots, the offload per-slot budget
# regression test — fired only when a human happened to run `cargo test` on the
# dev machine. A tripwire with no automated consumer is a silent failure with
# extra steps, so this job is that consumer.
#
# Scope notes:
#  * DEFAULT features only. The GPU features are covered by the clippy job
#    (`tts-webgpu`) and by the release build; the model-backed smoke tests are
#    `#[ignore]`d and need Kokoro/Whisper blobs the runner does not have, so a
#    plain `cargo test` is the right surface here.
#  * `--bin cimp` is REQUIRED, not a preference: the crate has no lib target
#    (Cargo.toml declares only `[[bin]]`), so `cargo test --lib` fails outright.
#  * TWO jobs since 2026-08-13: `tests` on Windows (the primary platform, and
#    the OS whose cargo cache it shares with clippy.yml) and `test-linux` on
#    ubuntu-24.04. Before the second one, cargo ran on Linux in exactly ONE
#    place — release.yml's `build-linux`, which is tag-triggered, `needs:
#    build-windows`, and builds without testing — so a Linux break surfaced at
#    tag time or not at all. The long note on `test-linux` below has the
#    reasoning, incl. why it is a separate job rather than a matrix.
#
# Trigger shape — `paths-ignore`, NOT `paths` (F-30, user decision 2026-08-12).
# This job used to carry an ALLOWLIST of paths that can affect the tests. That
# list was wrong: `detection/`, `themes/` and `palettes/` are all read from disk
# by the suite and appeared in neither block, so a commit touching only those was
# untested *and* runless — no Tests run existed for the release gate to consult,
# and the failure surfaced at TAG time, the most expensive moment to learn it.
#
# The deeper problem is that the allowlist could not be verified: there is no
# reliable way to enumerate what the suite reads from disk, so the list drifts
# every time a data directory is added — and it drifts FAIL-OPEN, because a
# forgotten entry means the tests silently do not run. Inverting it flips the
# drift direction: anything not named here triggers, so a forgotten entry gets
# TESTED rather than skipped. Nothing has to be kept in sync, which is why this
# needs no tripwire.
#
# Only paths that provably cannot affect a test result belong below. Note
# `clippy.yml` deliberately KEEPS its allowlist — its entries really are compile
# inputs, so that list is verifiable in the way this one was not.
on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

# Same policy as clippy.yml: a newer push on the same ref supersedes the run in
# flight rather than queueing behind it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    # Cold cargo build of this dep graph is ~15 min on a Windows runner; test
    # linking + execution adds several more. 75 covers a fully cold, fully
    # cache-missed run without letting a hung test burn an hour.
    timeout-minutes: 75
    env:
      # Node 24 actions runtime (see release.yml).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      # `npm install`, not `npm ci`: the committed lockfile was generated under
      # npm 11.x and the runner ships npm 10.x, which is stricter about
      # peer-dep resolution and rejects the tree outright (same reason and same
      # trade-off documented on release.yml's install step and clippy.yml's).
      - name: Install npm deps
        run: npm install --no-audit --no-fund

      # Frontend tests first — they are ~30 s and catch the cheap failures
      # before the multi-minute cargo build starts.
      - name: vitest
        run: npx vitest run

      # Code review 2026-08-24, finding RV-6. NO CI job ran `svelte-check`, so
      # the frontend's type layer was verified only when a human happened to
      # run it. That gap got sharp with V42 Phase E: `src/lib/settings/types.ts`
      # is GENERATED from `settings/schema.rs` now, and the step below already
      # fails when the committed bindings are stale — but a schema change that
      # regenerates cleanly and *breaks a call site* (a renamed field, a
      # narrowed union, an added variant nothing handles) is invisible to
      # `git diff` and invisible to vitest, which does not type-check. This is
      # the consumer of that signal.
      #
      # Windows only, mirroring vitest and for the same stated reason as the
      # Linux job's missing vitest step: both are Node-only and cannot differ
      # by OS, so a second copy is a second thing to maintain re-proving the
      # same result. `npm run build` is different — it runs on both jobs
      # because tauri-build needs the bundle there, not as a duplicate gate.
      - name: svelte-check
        run: npm run check

      # tauri-build resolves `frontendDist` (../dist) at compile time, so the
      # bundle must exist before cargo runs — same as the clippy job.
      #
      # It is also a real gate in its own right, which is why it is not merely
      # a build step: `vite build` runs lightningcss over the stylesheets and
      # rejects CSS that svelte-check happily accepts. That has already caught
      # a break the type checker could not see (V42, 2026-08-24).
      - name: Build frontend
        run: npm run build

      # Floating stable, matching clippy.yml. The declared MSRV
      # (`Cargo.toml rust-version = "1.88"`) is NOT verified by CI — nothing
      # here ever compiles on 1.88. Accepted gap, 2026-08-05.
      - name: Setup Rust (floating stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch, 2026-07-15
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          # Same key family as clippy.yml so both Windows jobs share one cargo
          # cache rather than each paying a cold dependency build.
          shared-key: cimp-win-src-tauri
          cache-on-failure: true

      - name: cargo test
        working-directory: src-tauri
        env:
          # bindgen / clang-sys for whisper-rs-sys + misaki-rs -> espeak-ng-sys.
          # The runner image ships LLVM here.
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        # `--bin cimp` because there is no lib target (see the header note).
        # `--locked` so CI tests the committed Cargo.lock resolution.
        run: cargo test --locked --bin cimp

      # V42 Phase E — the settings types and defaults are GENERATED.
      # `settings::codegen` writes src/lib/settings/generated/{settings.ts,
      # defaults.json} during the `cargo test` above, from
      # src-tauri/src/settings/schema.rs via ts-rs. Both are committed, and the
      # frontend imports them, so a schema change whose regenerated output was
      # not committed would ship a stale mirror — the exact drift this phase
      # deleted the hand-written one to end.
      #
      # This step is the consumer of that signal: it fails the run when what
      # the suite just regenerated differs from what is in the tree. The
      # generation itself is silent by design (`write_if_changed`), so without
      # a diff check here nothing would ever notice.
      #
      # Byte-exact on purpose, on BOTH runners: `.gitattributes` marks the
      # directory `-text`, so neither this Windows checkout (autocrlf=true) nor
      # the Linux one below translates line endings, and ts-rs emits LF.
      #
      # Code review 2026-08-24 (dropped-at-cap): `git diff` sees TRACKED files
      # only. A generator that emits a NEW file — a type given its own
      # `export_to`, a second root added beside `LocalProviderBlock`, a rename
      # that leaves the old name behind — leaves it untracked, and the frontend
      # would import a file no one committed. `ls-files --others` is the half
      # `git diff` cannot answer, and it is deliberately run WITHOUT
      # `--exclude-standard` so a `.gitignore` entry cannot hide the very file
      # this step exists to notice.
      - name: Generated settings bindings are up to date
        run: |
          git diff --exit-code -- src/lib/settings/generated
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::the committed settings bindings differ from what the suite just generated — run cargo test and commit src/lib/settings/generated."
            exit $LASTEXITCODE
          }
          $untracked = @(git ls-files --others -- src/lib/settings/generated)
          if ($untracked.Count -gt 0) {
            Write-Host "::error::the generator wrote files that are not committed:"
            $untracked | ForEach-Object { Write-Host "  $_" }
            exit 1
          }

      # Code review 2026-08-08, finding O-1. The suite has `#[ignore]`d tests and
      # CI ran NONE of them, so the only *executable* guards for the Phase H
      # gate-cache race (#48, H-1 and M-15) — every other test in that file greps
      # the generated plugin source — fired only when a human remembered
      # `--ignored`.
      #
      # Only the node-backed ones can run here, deliberately:
      #  * `harness::opencode::plugin::tests::the_gate_cache_survives_a_beacon_racing_an_in_flight_query`
      #    (H-1), `harness::opencode::plugin::tests::the_gate_refuses_local_tools_while_the_beacon_is_in_flight`
      #    (M-15) and
      #    `harness::opencode::plugin::tests::the_gate_refuses_native_web_from_a_contaminated_but_unlatched_tab`
      #    (F-13) and
      #    `harness::opencode::plugin::tests::the_gate_and_beacon_survive_a_fetch_swap_after_load`
      #    (V33 C6 / H-7 — the only executable proof that binding `fetch` at
      #    plugin load actually survives a later `globalThis.fetch` swap; every
      #    other test of that template greps the emitted source, which cannot
      #    reach the property) need `node` on PATH, which this job has
      #    unconditionally — `npx vitest run` is ten steps up. That is the whole
      #    reason O-1 is cheap.
      #  * `tts::engine::tests::synthesizes` needs the Kokoro model + voicepack
      #    and `tts::phonemize::tests::espeak_fallback_engages_on_oov` needs the
      #    `espeak-ng-data` dir; neither is on the runner (see the header note).
      #    Both PASS on a dev machine that has them (verified 2026-08-09), so
      #    they are ignored-for-inputs, not ignored-because-broken — but a
      #    blanket `-- --ignored` here would be red forever.
      #
      # Two assertions, because each covers a way this step could go quietly
      # useless:
      #  1. The ignored INVENTORY is pinned. A new `#[ignore]` fails this step,
      #    so somebody decides whether it belongs in CI instead of it joining a
      #    never-run pile — which is how O-1 happened in the first place.
      #  2. Each run is checked for `1 passed`. `cargo test` exits 0 when a
      #    filter matches nothing, so a rename would otherwise leave a green
      #    step that executed no test at all.
      - name: cargo test (ignored, node-backed)
        working-directory: src-tauri
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        run: |
          # The node-backed ones, run below one at a time.
          $nodeBacked = @(
            'harness::opencode::plugin::tests::the_gate_cache_survives_a_beacon_racing_an_in_flight_query',
            'harness::opencode::plugin::tests::the_gate_refuses_local_tools_while_the_beacon_is_in_flight',
            'harness::opencode::plugin::tests::the_gate_refuses_native_web_from_a_contaminated_but_unlatched_tab',
            'harness::opencode::plugin::tests::the_gate_and_beacon_survive_a_fetch_swap_after_load'
          )
          $expected = ($nodeBacked + @(
            'tts::engine::tests::synthesizes',
            'tts::phonemize::tests::espeak_fallback_engages_on_oov'
          )) | Sort-Object

          $listed = @(
            cargo test --locked --bin cimp -- --ignored --list |
              Select-String -Pattern '^(?<n>\S+): test$' |
              ForEach-Object { $_.Matches[0].Groups['n'].Value }
          ) | Sort-Object

          if ($listed.Count -ne $expected.Count -or (Compare-Object $expected $listed)) {
            Write-Host "::error::the set of #[ignore]d tests changed — decide whether the new one runs in CI, then update this step."
            Write-Host "expected: $($expected -join ', ')"
            Write-Host "found:    $($listed -join ', ')"
            exit 1
          }

          # One `--exact` run each, not one filtered run: two tests reported as
          # "2 passed" would also be reported that way if a third was silently
          # added, and a per-name run is what makes the rename check bite.
          foreach ($name in $nodeBacked) {
            $log = Join-Path $env:RUNNER_TEMP "ignored-$($name.GetHashCode()).log"
            cargo test --locked --bin cimp -- --ignored --exact $name 2>&1 | Tee-Object -FilePath $log

            if (-not (Select-String -Path $log -Pattern 'test result: ok\. 1 passed' -Quiet)) {
              Write-Host "::error::$name did not report '1 passed' — it either failed, or the filter matched nothing because the test was renamed."
              exit 1
            }
          }

  # V33, 2026-08-13. The same suite on Linux, because until this job existed
  # cargo ran on Linux in exactly ONE place: release.yml's `build-linux`. That
  # job is tag-triggered, carries `needs: build-windows`, and BUILDS ONLY — it
  # runs no test at all. So a Linux-only compile break or test failure could
  # not surface before tag time, inside the most expensive job in the pipeline,
  # *after* the Windows build had already created the GitHub release. The gap
  # is recorded in docs/MAINTENANCE.md ("CI coverage — what the workflows do
  # and do not check"); this job is what closes it.
  #
  # V33 is what turns that from tidy into urgent. Stage 1 gives
  # `process_guard` / `procutil::kill_tree` a Linux implementation, and Phase D
  # adds Landlock sandboxing behind `[target.'cfg(unix)']` + `pre_exec` — code
  # the Windows job cannot compile at all, let alone run. Writing Linux-only
  # code with no Linux CI is writing untested code, and the `tests` job above
  # goes green while none of it is touched.
  #
  # A SEPARATE JOB, not a matrix on `tests`. Four reasons, heaviest first:
  #  1. The steps genuinely differ — an apt step, a LIBCLANG_PATH that has to
  #     be discovered rather than hardcoded, and no PowerShell. A matrix would
  #     hang `if: runner.os == …` off roughly half its steps, which reads worse
  #     than two jobs and fails worse: an `if:` that silently evaluates false
  #     is a step that quietly stops running — the same fail-open shape as the
  #     `paths:` allowlist F-30 replaced.
  #  2. Combining them shares nothing. The cargo-cache argument that keeps the
  #     Windows job next to clippy.yml does not cross OSes —
  #     Swatinem/rust-cache keys on runner OS + rustc version no matter what
  #     `shared-key` says — so a matrix would still be two cold caches. Linux
  #     gets its own key family below, ready for a Linux clippy job to share
  #     the way the two Windows jobs already do.
  #  3. Matrix `fail-fast` defaults to TRUE, so the first OS to go red cancels
  #     the other — destroying the one thing this job exists to tell you:
  #     whether a failure is cross-platform or Linux-only. `fail-fast: false`
  #     fixes that, but a matrix that shares no cache and fails independently
  #     is just two jobs with extra indirection.
  #  4. Independent timeouts (see below).
  #
  # THE RELEASE GATE NEEDS NO CHANGE — checked, not assumed. release.yml's
  # `gate-tests` polls the workflow-RUNS API and matches on
  # `r.conclusion === "success"`, the workflow-level roll-up; it never names a
  # job. A red job here therefore turns the whole Tests run red and blocks the
  # tag on its own. That is the intent, and it is worth stating plainly: this
  # job can now stop a release, which is precisely the point of moving the
  # failure from tag time to push time.
  test-linux:
    # Pinned, NOT `ubuntu-latest`: that label drifts to the next LTS on
    # GitHub's schedule, and this job's whole value is predicting what
    # release.yml's `build-linux` will do — which is pinned to ubuntu-24.04
    # because the shipped binary's floor is 24.04/glibc 2.39 (ort's WebGPU
    # prebuilt; see docs/MILESTONE-linux-support.md and MAINTENANCE.md). The
    # floor argument does not strictly bind a DEFAULT-feature job, which never
    # links ort's WebGPU EP — matching the release runner does.
    runs-on: ubuntu-24.04
    # Same 75 as the Windows job, and the number matters beyond this file:
    # release.yml's gate-tests waits 80 minutes (160 x 30 s) for the Tests RUN
    # to finish. Jobs run in parallel, so a run's wall clock is the SLOWER job
    # rather than the sum — 75 here keeps the run inside the ceiling the gate
    # already budgets for. Raising it above 80 would make the gate time out
    # (and fail the release) instead of reading a result.
    timeout-minutes: 75
    env:
      # Node 24 actions runtime (see release.yml).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      # V33 Phase D — THIS RUNNER PROMISES A KERNEL THAT CAN SANDBOX.
      #
      # The Landlock live tests (`sandbox::linux`) skip when the ABI probe finds
      # no usable Landlock, because a laptop or an old container is a legitimate
      # place to run them. But `cargo test` CAPTURES the stdout of passing
      # tests, so in this log a skip and a genuinely exercised pass are the same
      # two characters: `ok`. Without this variable, the day a runner image, a
      # container flag or a kernel `lsm=` list drops Landlock, the tests that
      # exist to catch exactly that would go green and say nothing.
      #
      # Set here, it converts that skip into a PANIC: the promise is made by
      # this file, so this file is where a broken one gets reported.
      # ubuntu-24.04 ships kernel 6.8 with Landlock ABI 4 enabled — if that ever
      # stops being true, the right response is to see a red run and decide, not
      # to discover months later that the sandbox suite had been vacuous.
      #
      # To retire the promise (a runner that genuinely cannot sandbox), delete
      # this line — deliberately, in a reviewed diff.
      CIMP_EXPECT_LANDLOCK: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Derived from release.yml's `build-linux` — the only Linux recipe in
      # this repo that is PROVEN to compile the tree — minus the rows that
      # exist for the GPU features. Every package below is copied from there,
      # not invented; the deltas, and why each is safe, are:
      #
      #  * DROPPED `libvulkan-dev glslang-tools spirv-tools
      #    mesa-vulkan-drivers`, and the whole LunarG-repo step that installs
      #    `shaderc`/`vulkan-headers` for `glslc`. Those serve `stt-vulkan`
      #    only (`whisper-rs/vulkan` → ggml-vulkan's shader-generator
      #    sub-build). This job builds DEFAULT features, and `default = []` in
      #    src-tauri/Cargo.toml — no Vulkan, no glslc, and several minutes of
      #    apt saved on every run.
      #  * DROPPED `unzip`: nothing in the release job's own steps invokes it
      #    (scripts/fetch-models.ps1 does no archive extraction either), and
      #    this job runs neither the models fetch nor any staging step.
      #  * KEPT the whole Tauri/GTK/appindicator block verbatim. Paring it to
      #    "what default features surely need" would be guessing at which of
      #    tauri's optional link inputs the tree drags in; the proven set costs
      #    nothing and guesses nothing.
      #  * KEPT `libssl-dev` even though nothing GPU is being built — this is
      #    the answer to "do default features need a native dep at all", and it
      #    is yes. `ort`'s `download-binaries` feature is on UNCONDITIONALLY in
      #    Cargo.toml (the EP features are what's optional), and ort-sys'
      #    downloader is ureq → native-tls → openssl on Linux. Build-time only;
      #    it does not link into the binary.
      #  * KEPT `espeak-ng-data`. Strictly it is not required — build.rs's
      #    `copy_espeak_data` panics on Windows when the data is missing but
      #    only warns off Windows — so omitting it would still compile. It
      #    stays because a permanently-warning build teaches people to ignore
      #    build warnings, and because the package is small.
      #  * KEPT `cmake clang libclang-dev llvm` (whisper.cpp's C build +
      #    bindgen for whisper-rs-sys / espeak-rs-sys) and `libasound2-dev`
      #    (cpal/rodio's ALSA backend). All three are default-feature deps.
      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev build-essential pkg-config file \
            libasound2-dev cmake clang libclang-dev llvm \
            libssl-dev espeak-ng-data

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      # `npm install`, not `npm ci` — see the Windows job's note above.
      - name: Install npm deps
        run: npm install --no-audit --no-fund

      # No `vitest` step here on purpose. The frontend suite is Node-only and
      # platform-independent; the Windows job already runs it, and a second
      # copy would double the maintenance surface to re-prove a result that
      # cannot differ by OS. `npm run build` is NOT optional though —
      # tauri-build resolves `frontendDist` (../dist) at compile time, so the
      # bundle must exist before cargo runs.
      - name: Build frontend
        run: npm run build

      # Floating stable, same pin and same accepted MSRV gap as the Windows
      # job. `toolchain:` is explicit because the action is pinned to a SHA
      # rather than to the `stable` branch, and otherwise infers from the ref.
      - name: Setup Rust (floating stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch, 2026-07-15
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          # Its own key family: rust-cache already scopes by runner OS, so this
          # could never have collided with `cimp-win-src-tauri` — naming it
          # separately is for the reader, and reserves the key a future Linux
          # clippy job would share (mirroring the Windows pair).
          shared-key: cimp-linux-src-tauri
          cache-on-failure: true

      - name: cargo test
        working-directory: src-tauri
        shell: bash
        # Same command as the Windows job — `--bin cimp` because there is no
        # lib target, `--locked` so CI tests the committed Cargo.lock.
        #
        # The `#[ignore]`d tests are NOT run here. The inventory-pin step lives
        # on the Windows job and asserts a GLOBAL property of the suite (which
        # tests carry `#[ignore]`), so a second copy would be a second thing to
        # update rather than a second signal; and the model-backed ones need
        # Kokoro/Whisper blobs this runner does not have either.
        run: |
          set -e
          # bindgen (whisper-rs-sys, espeak-rs-sys) needs libclang; find it
          # regardless of the runner's LLVM version. Verbatim from
          # release.yml's build-linux.
          #
          # This export is what neutralises src-tauri/.cargo/config.toml, whose
          # `[env]` block hardcodes LIBCLANG_PATH to 'C:\Program Files\LLVM\bin'
          # (and VULKAN_SDK to a C:\ path, unused without stt-vulkan). Cargo's
          # `[env]` does NOT override a variable already in the environment
          # unless the entry sets `force = true`, which neither does — so the
          # value exported here wins. Same mechanism release.yml's build-linux
          # relies on, which is where the evidence that it works comes from.
          export LIBCLANG_PATH="$(dirname "$(find /usr/lib/llvm-* -name libclang.so 2>/dev/null | sort | tail -1)")"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH"
          cargo test --locked --bin cimp

      # The Linux half of the V42 Phase E check (see the Windows job's note,
      # including why the untracked half is needed and why it skips
      # `--exclude-standard`). This copy is the one that would catch a
      # platform-dependent generator: a line ending, a path separator in a
      # `#[ts(type = "import('…')")]` seam, or a HashMap iteration order that
      # happens to be stable on one OS.
      - name: Generated settings bindings are up to date
        shell: bash
        run: |
          set -e
          if ! git diff --exit-code -- src/lib/settings/generated; then
            echo "::error::the committed settings bindings differ from what the suite just generated — run cargo test and commit src/lib/settings/generated."
            exit 1
          fi
          untracked=$(git ls-files --others -- src/lib/settings/generated)
          if [ -n "$untracked" ]; then
            echo "::error::the generator wrote files that are not committed:"
            echo "$untracked"
            exit 1
          fi
