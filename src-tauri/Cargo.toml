[package]
name = "cimp"
version = "0.49.1"
description = "Claude Code wrapper with TTS, avatar, and compose overlay"
authors = ["Amir Amashe"]
edition = "2021"
rust-version = "1.88"
# Resolver v3 = v2's feature rules PLUS cargo's MSRV-aware dependency
# resolution: `cargo update` / `cargo add` will not pick a dependency version
# whose own `rust-version` exceeds ours (1.88 above). Edition 2021 defaults to
# resolver "2", under which MSRV-awareness is INACTIVE — a bare `cargo update`
# could silently pull an MSRV-breaking release of an MSRV-sensitive crate
# (e.g. `ignore`) and only fail at compile time. Requires cargo 1.84+.
resolver = "3"

[[bin]]
name = "cimp"
path = "src/main.rs"

[features]
# Default is CPU-only so routine builds, `cargo test`, and rust-analyzer work
# from a plain shell with no GPU SDK / dev-env / generator requirements.
default = []

# GPU-accelerated STT via whisper.cpp's VULKAN backend. Produces a fully
# PORTABLE binary — the only GPU runtime dependency is the system vulkan-1.dll
# (present on all Win10+) — runs on any vendor's GPU (NVIDIA/AMD/Intel), and
# falls back to CPU automatically when no GPU is present (see stt/engine.rs).
# This is what the RELEASE ships, so the portable zip gets auto GPU/CPU with no
# bundled DLLs. Building it needs the Vulkan SDK + the MSVC dev environment +
# the Ninja generator (ggml's nested shader-generator sub-build); see
# docs/MAINTENANCE.md and the release.yml build step.
stt-vulkan = ["whisper-rs/vulkan"]

# Optional NVIDIA-only fast path (~20-40% faster than Vulkan for whisper).
# NOT portable (imports cublas64_*.dll) and needs the CUDA toolkit at build
# time — on this box CUDA 13.2 specifically, with 13.2's bin first on PATH (see
# docs/MAINTENANCE.md). Build with `--features stt-cuda`.
stt-cuda = ["whisper-rs/cuda"]

# GPU-accelerated TTS (Kokoro) via ONNX Runtime's WebGPU execution provider
# (Dawn-backed: D3D12 on Windows, Vulkan on Linux, Metal on macOS). Like
# `stt-vulkan` this is PORTABLE and vendor-agnostic — runs on any NVIDIA/AMD/
# Intel GPU and falls back to CPU when none is usable (see tts/engine.rs). The
# only added runtime deps are the bundled Dawn dylibs (webgpu_dawn.dll +
# dxcompiler.dll + dxil.dll on Windows). Validated ~5x faster than CPU and
# correct on Kokoro incl. the ConvTranspose that broke DirectML — see
# docs/features/FEATURE-tts-webgpu.md. This is what the RELEASE ships for TTS.
# Unlike `stt-vulkan` it needs NO Vulkan SDK / Ninja at build time (prebuilt).
tts-webgpu = ["ort/webgpu"]

# Optional NVIDIA-only TTS GPU path. Works on Pascal..Ada but NOT on Blackwell
# (sm_120): pyke's prebuilts carry no sm_120 cubins and no PTX to JIT from —
# still true at ORT 1.23.2 / rc.13, see docs/MAINTENANCE.md. NOT portable
# (imports CUDA DLLs). MUTUALLY EXCLUSIVE with `tts-webgpu`: pyke ships no
# prebuilt combining `cuda`+`webgpu`, and ort-sys does NOT fail on that combo —
# it prints a `cargo:warning` and silently downloads the CPU-only prebuilt, so
# you get a GPU-less build that still *looks* like it built fine. Pick exactly
# one. Build with `--features tts-cuda`.
tts-cuda = ["ort/cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# V14 Phase F: `unstable` gates `Window::add_child` (the multi-webview API
# the Preview tab's embedded child webview is built on) — Tauri's own name
# for the feature, not a claim about our usage of it.
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
# Windows 11 Snap Layouts on our custom (frameless) title bar: injects a
# transparent Win32 child HWND over the maximize button that returns
# HTMAXBUTTON from WM_NCHITTEST so hovering it shows the OS snap-zone flyout.
# Compiles cross-platform — a real impl on Windows, a no-op stub on Linux/macOS
# and pre-Win11 — so it needs no cfg gating and adds nothing to the Linux build.
tauri-plugin-snap-layout = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "io-std", "time", "fs", "process", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
# 0.9 replaces the unmaintained `serial` stack (`serial`/`serial-core`/
# `serial-unix`/`serial-windows` + `termios`, the RUSTSEC-2017-0008 carrier)
# with `serial2`, and drags `nix` 0.25 -> 0.28. The `PtySystem`/`MasterPty`/
# `Child`/`ChildKiller` API we use is source-compatible; the traits merely
# gained `Downcast + Send` supertraits, which our `Box<dyn ... + Send [+ Sync]>`
# aliases already satisfied.
#
# NOTE: 0.9.0 does NOT fix the inverted Windows `TerminateProcess` check —
# `src/win/mod.rs` is byte-identical to 0.8.1's, so `WinChildKiller::kill`
# still returns `Err(last_os_error())` when the kill SUCCEEDS and `Ok(())` when
# it fails. `PtyManager::shutdown` only *logs* on `Err`, so the sole symptom is
# a misleading "kill failed; child may be orphaned" warning on every clean
# shutdown. We deliberately do NOT invert it on our side: that compensation
# would silently break the day upstream fixes theirs.
portable-pty = "0.9"
thiserror = "1"
# V12 Phase A: `run_check` diagnostic parsers (tsc / generic gcc-style
# `file:line:col: level: message`). Pure Rust, no C deps.
regex = "1"
# V22 Phase C: the `junit-xml` check parser streams a JUnit report with a
# real XML reader rather than a fragile regex. Pure Rust, already in the tree
# transitively (promoted to a direct dep here). Default features.
quick-xml = "0.41"
# Usage push: converts the status-line payload's `rate_limits.resets_at`
# (Unix epoch seconds) to the ISO-8601 strings the usage widget renders.
# Already in the tree transitively; minimal features — no clock/timezone use.
chrono = { version = "0.4", default-features = false, features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
base64 = "0.22"
which = "6"
vte = "0.13"
shlex = "1"
uuid = { version = "1", features = ["v4"] }
# V8-01 offload: async methods on the ToolRouter trait (native + MCP-host
# tool dispatch share one abstraction). Pure-Rust, ubiquitous.
async-trait = "0.1"

# Claude Code usage tracker: GETs the undocumented oauth/usage endpoint.
# rustls-tls keeps TLS pure-Rust (no system OpenSSL) for the single-binary build.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# System-monitor panel (CPU / memory / network). Pure-Rust, no admin.
sysinfo = { version = "0.36", default-features = false, features = ["system", "network"] }
# NVIDIA GPU stats (utilization / memory / temperature). Loads nvml.dll at
# runtime; absent driver → GPU section degrades to n/a.
nvml-wrapper = "0.12"

# TTS (Kokoro via ONNX Runtime). misaki-rs default features include espeak-ng
# fallback for OOV words; the resulting binary is GPLv3 (see NOTICE).
misaki-rs = "0.3"
# ONNX Runtime bindings. rc.11 wraps ONNX Runtime 1.23.2 (see ort-sys'
# build/download/dist.txt).
#
# NO execution-provider feature belongs here — the EP is selected by cImp's own
# mutually-exclusive `tts-webgpu` / `tts-cuda` features above, which map to
# `ort/webgpu` / `ort/cuda`. `webgpu` used to be pinned on unconditionally, and
# that was wrong twice over: plain CPU builds (the default, incl. `cargo test`
# and rust-analyzer) downloaded the WebGPU prebuilt they never use, and
# `--features tts-cuda` resolved to `webgpu`+`cuda` — a combination pyke ships
# no prebuilt for, so ort-sys warned and silently linked the CPU-only prebuilt
# instead, producing a "CUDA" build with no GPU at all.
ort = { version = "=2.0.0-rc.11", features = ["download-binaries"] }
bytemuck = "1"

# Audio output
cpal = "0.15"
rodio = "0.20"

# STT (Whisper via whisper.cpp bindings). Statically links one C library;
# needs a C/C++ toolchain + CMake at build time (see MAINTENANCE.md). CUDA is
# a compile-time feature (`stt-cuda`) wired to the same CIMP_GPU=cuda runtime
# opt-in as ort — see [features] below. Default build is CPU-only so it works
# on any machine without the CUDA toolkit.
whisper-rs = "0.16"
# Native-rate -> 16 kHz mono resampling of captured mic audio for Whisper.
rubato = "0.16"
tree-sitter = "0.26.9"
tree-sitter-rust = "0.24.2"
# Phase E grammars. They expose their `LANGUAGE*` as version-independent
# `LanguageFn`s (the `tree-sitter-language` shim), so these grammar-crate
# versions don't need to track tree-sitter's own 0.26 — only the parser ABI
# must match, which it does.
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
# V9-02 multi-language fan-out. Same `LanguageFn` shim contract as the Phase E
# grammars above — version-independent, ABI-matched. Tier 1 (full code graph):
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-php = "0.24.2"
tree-sitter-bash = "0.25.1"
tree-sitter-scala = "0.26.0"
tree-sitter-ocaml = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-haskell = "0.23.1"
# Tier 2/3 (markup/data — struct-search + anchors, no call graph):
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-json = "0.24.8"
# Medium-risk mainstream + exotic tail. Vetted to build against ts 0.26.
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-swift = "0.7.3"
tree-sitter-sequel = "0.3.11"
tree-sitter-yaml = "0.7.2"
tree-sitter-xml = "0.7.0"
tree-sitter-erlang = "0.20.0"
tree-sitter-r = "1.3.0"
tree-sitter-perl = "1.1.2"
tree-sitter-ada = "0.1.0"
tree-sitter-asm = "0.24.0"
# Embedded code-knowledge-graph store (V9-01). `storage-sqlite` is the
# single-file backend; `rayon` is required by cozo's core eval loop. We
# deliberately omit `graph-algo` (its `graph_builder 0.4.1` dep is broken
# against the current rayon, and we don't need PageRank/etc. — transitive
# queries are plain recursive Datalog) and `storage-rocksdb` (C++, heavy).
cozo = { version = "0.7.6", default-features = false, features = ["storage-sqlite", "rayon"] }
# Gitignore-respecting directory walker for the graph's full-tree indexer
# (ripgrep's walker). Skips `target/`, `node_modules/`, etc. for free.
ignore = "0.4"
# Cross-platform fs watcher for incremental graph re-indexing (Phase D). On
# Windows this is ReadDirectoryChangesW under the hood. Debounce + gitignore
# filtering are done in `graph::watcher`.
notify = "6"
# Native file/folder picker for the Settings graph-ignore editor
# (`graph_ignore_pick`). Win32 IFileDialog on Windows; `xdg-portal` (not gtk3)
# on Linux so we don't link a second GTK next to Tauri's, with `tokio` as the
# portal's async backend to match the app runtime.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
# V17 Phase A: line-level unified diffs for the read advisor's diff-substitute
# branch (a changed-file re-read is answered with a diff against the last-read
# snapshot, not the whole file). Pure Rust, MIT/Apache; `text` only — we don't
# use the inline/bytes/serde/unicode features. One call site: `graph::context::unified_diff`.
similar = { version = "2", default-features = false, features = ["text"] }

# V14 Phase F (Preview tab): official Tauri plugin for "open this URL/path in
# the user's default browser/file manager" — used for external links clicked
# inside a Preview tab's embedded webview (denied `on_new_window`/off-policy
# `on_navigation` targets) and the fallback "open in system browser" button.
# Pulls in the cross-platform `open` crate; its Linux xdg-open path drags in
# `zbus`/`async-*` but those are only compiled for `cfg(target_os = "linux")`
# inside `open`, so the Windows build gains nothing from them.
tauri-plugin-opener = "2"
# V14 Phase F: parses/classifies Preview-tab navigation targets
# (`preview::is_allowed_preview_host`). Already resolved in Cargo.lock as a
# transitive dependency (reqwest/tauri), so depending on it directly adds no
# new entries to the tree.
url = "2"

# Windows-only: registry probe for Git Bash auto-detection in shell::detect.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Windows-only: Job Object backstop so OS reaps spawned children (llama-server,
# MCP host, run_command) when cImp dies hard. See `process_guard`. Version
# matched to the one Tauri already pulls in to avoid a duplicate dep.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
# V14 Phase F (Preview tab, `preview::capture`): the single COM call this
# module needs — `ICoreWebView2::CapturePreview` — isn't exposed by wry, so
# `preview::capture` reaches through `Webview::with_webview`'s
# `PlatformWebview::controller()` (an `ICoreWebView2Controller` from THIS
# crate) to get there. Pinned to "0.38" — the exact version wry 0.55
# transitively resolves to (see Cargo.lock) — so the type wry hands back and
# the type this crate casts against are the SAME nominal type, not just
# COM-GUID-compatible; a version drift here would fail to compile, not
# silently misbehave.
webview2-com = "0.38"
# The ergonomic `windows` crate (distinct from `windows-sys` above, which has
# no COM/interface support) for the few Win32 APIs `preview::capture` calls
# directly: `SHCreateStreamOnFileW` (a FILE-BACKED `IStream`, so
# `CapturePreview`'s PNG output lands on disk with no manual byte-copying)
# and the `STGM_*` open-mode flags. Pinned to "0.61" to match what
# `webview2-com` 0.38.2 itself depends on (see its Cargo.toml), keeping
# `IStream`/`PCWSTR`/etc. type-identical between the two crates.
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
# V14 Phase B: backdating a directory's mtime in `attach::tests` (to exercise
# `attach::prune`'s age cutoff). Already resolved in Cargo.lock as a
# transitive dependency of another crate; pinning it directly here adds no
# new entries to the dependency tree.
filetime = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
