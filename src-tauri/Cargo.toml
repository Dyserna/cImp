[package]
name = "cctts"
version = "0.10.0"
description = "Claude Code wrapper with TTS, avatar, and compose overlay"
authors = ["Amir Amashe"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "cctts"
path = "src/main.rs"

[features]
# Default is CPU-only so routine builds, `cargo test`, and rust-analyzer work
# from a plain shell with no GPU SDK / dev-env / generator requirements.
default = []

# GPU-accelerated STT via whisper.cpp's VULKAN backend. Produces a fully
# PORTABLE binary — the only GPU runtime dependency is the system vulkan-1.dll
# (present on all Win10+) — runs on any vendor's GPU (NVIDIA/AMD/Intel), and
# falls back to CPU automatically when no GPU is present (see stt/engine.rs).
# This is what the RELEASE ships, so the portable zip gets auto GPU/CPU with no
# bundled DLLs. Building it needs the Vulkan SDK + the MSVC dev environment +
# the Ninja generator (ggml's nested shader-generator sub-build); see
# docs/MAINTENANCE.md and the release.yml build step.
stt-vulkan = ["whisper-rs/vulkan"]

# Optional NVIDIA-only fast path (~20-40% faster than Vulkan for whisper).
# NOT portable (imports cublas64_*.dll) and needs the CUDA toolkit at build
# time — on this box CUDA 13.2 specifically, with 13.2's bin first on PATH (see
# docs/MAINTENANCE.md). Build with `--features stt-cuda`.
stt-cuda = ["whisper-rs/cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
portable-pty = "0.8"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
base64 = "0.22"
which = "6"
vte = "0.13"
shlex = "1"
uuid = { version = "1", features = ["v4"] }

# Claude Code usage tracker: GETs the undocumented oauth/usage endpoint.
# rustls-tls keeps TLS pure-Rust (no system OpenSSL) for the single-binary build.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# System-monitor panel (CPU / memory / network). Pure-Rust, no admin.
sysinfo = { version = "0.36", default-features = false, features = ["system", "network"] }
# NVIDIA GPU stats (utilization / memory / temperature). Loads nvml.dll at
# runtime; absent driver → GPU section degrades to n/a.
nvml-wrapper = "0.12"

# TTS (Kokoro via ONNX Runtime). misaki-rs default features include espeak-ng
# fallback for OOV words; the resulting binary is GPLv3 (see NOTICE).
misaki-rs = "0.3"
ort = { version = "=2.0.0-rc.11", features = ["download-binaries", "cuda"] }
ndarray = "0.16"
bytemuck = "1"

# Audio output
cpal = "0.15"
rodio = "0.20"

# STT (Whisper via whisper.cpp bindings). Statically links one C library;
# needs a C/C++ toolchain + CMake at build time (see MAINTENANCE.md). CUDA is
# a compile-time feature (`stt-cuda`) wired to the same CCTTS_GPU=cuda runtime
# opt-in as ort — see [features] below. Default build is CPU-only so it works
# on any machine without the CUDA toolkit.
whisper-rs = "0.16"
# Native-rate -> 16 kHz mono resampling of captured mic audio for Whisper.
rubato = "0.16"

# Windows-only: registry probe for Git Bash auto-detection in shell::detect.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
