name: Release portable Windows zip

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)build, e.g. v0.1.0'
        required: true

permissions:
  contents: write   # needed by `gh release create`

jobs:
  build-windows:
    runs-on: windows-latest
    # Exposed so build-linux (which `needs` this job) can reuse the resolved tag
    # and upload its tarballs to the release this job creates.
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    env:
      # Opt into the Node 24 actions runtime ahead of the June 2026 cutoff
      # so we don't see the "Node 20 actions deprecated" warning each run.
      # Affects how GitHub hosts third-party JS actions (checkout/cache/
      # setup-node/etc.); has no bearing on the Node version we install
      # for the build.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      # ggml-vulkan's nested shader-generator ExternalProject creates very deep
      # build paths; under the default target dir (deep under the workspace)
      # they blow past Windows' MAX_PATH (260) and cl/link fail. Build into a
      # real, short, STABLE drive-root dir so the paths stay short. Real (not a
      # `subst` virtual drive — those race the parallel ninja build and leave
      # ggml.c.obj unopenable at link, LNK1181) and stable across runs so the
      # rust-cache restores cleanly. Mirrors the working local build. Job-level
      # so the staging step reads the exe from the same path.
      CARGO_TARGET_DIR: 'C:\b'

    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ref="${{ inputs.tag }}"
          else
            ref="${{ github.ref_name }}"
          fi
          if [[ ! "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::tag '$ref' does not match v<X>.<Y>.<Z>"
            exit 1
          fi
          version="${ref#v}"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stage_dir_full=cimp-portable-win-x64-$ref" >> "$GITHUB_OUTPUT"
          echo "stage_dir_slim=cimp-portable-win-x64-$ref-no-models" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          # full history so the "previous tag" lookup in the release-notes
          # step finds prior tags
          fetch-depth: 0

      # Model blobs (Kokoro ONNX + voicepacks + Whisper) are NOT in git.
      # They used to be Git-LFS files, but every release run pulled ~820 MB
      # in BOTH build jobs and exhausted the LFS bandwidth quota; they now
      # live as assets on the `models-v1` GitHub release (unmetered
      # downloads). The cache keeps warm runs from downloading at all;
      # fetch-models.ps1 hashes everything against models/CHECKSUMS.txt and
      # downloads only missing/corrupt files, so a cache hit is a cheap
      # verify-only pass, a corrupt cache self-heals, and the old
      # "Verify committed Kokoro assets" step is subsumed.
      - name: Restore models cache
        uses: actions/cache@v4
        with:
          path: |
            models/kokoro-v1.0.onnx
            models/ggml-small.bin
            models/voices/*.bin
          key: models-${{ hashFiles('models/CHECKSUMS.txt') }}
          # one shared cache for the Windows and Linux jobs
          enableCrossOsArchive: true
          # a superseded cache still seeds most files; the fetch step
          # re-downloads only what changed
          restore-keys: |
            models-

      - name: Fetch + verify models
        shell: pwsh
        run: ./scripts/fetch-models.ps1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify version triple matches tag
        shell: bash
        run: |
          set -e
          expected="${{ steps.tag.outputs.version }}"

          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 -E '^version\s*=\s*"' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')

          echo "expected (tag):       $expected"
          echo "package.json:         $pkg"
          echo "tauri.conf.json:      $conf"
          echo "src-tauri/Cargo.toml: $cargo"

          fail=0
          for v in "$pkg" "$conf" "$cargo"; do
            if [ "$v" != "$expected" ]; then fail=1; fi
          done
          if [ $fail -eq 1 ]; then
            echo "::error::version mismatch — run scripts/bump-version.mjs $expected and re-tag"
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # V6-01 STT GPU: the released binary is built with the `stt-vulkan`
      # feature (whisper.cpp's Vulkan backend) so the portable zip auto-uses
      # any GPU and falls back to CPU — the only GPU runtime dep is the system
      # vulkan-1.dll. Building it needs the MSVC dev environment (ggml's nested
      # shader-generator sub-build resolves cl.exe from PATH) and the Vulkan SDK
      # (glslc + headers + vulkan-1.lib).
      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Vulkan SDK
        shell: pwsh
        env:
          VULKAN_VERSION: '1.4.350.0'
        run: |
          # LunarG's Windows installer filename is vulkansdk-windows-X64-<ver>.exe
          # (NOT VulkanSDK-<ver>-Installer.exe). Verified 2026-06-15.
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          $installer = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
          Write-Host "Downloading Vulkan SDK $env:VULKAN_VERSION"
          curl.exe -L --fail -o $installer $url
          # LunarG uses the Qt installer framework; this installs the core SDK
          # (glslc / headers / vulkan-1.lib) unattended.
          & $installer --accept-licenses --default-answer --confirm-command install | Out-Null
          $sdk = "C:\VulkanSDK\$env:VULKAN_VERSION"
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) { Write-Host "::error::Vulkan SDK install failed"; exit 1 }
          # Expose to subsequent steps (the build needs VULKAN_SDK; Bin on PATH
          # provides glslc for the shader generator).
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install npm deps
        # `npm install` rather than `npm ci` because the committed lockfile
        # was generated under newer npm (11.x) than the runner ships
        # (10.x), and npm 10 is stricter about peer-dep resolution. `npm
        # install` re-resolves transitive trees that npm 10 considers
        # missing without rejecting the whole tree. Trade-off: lockfile
        # is not strictly enforced in CI; acceptable for a single-target
        # personal build where every release is rebuilt from scratch.
        run: npm install --no-audit --no-fund

      - name: Tauri build (release)
        shell: pwsh
        env:
          # bindgen / clang-sys for misaki-rs -> espeak-ng-sys
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
          # ggml-vulkan builds its shader generator as a nested CMake
          # ExternalProject. The Visual Studio generator doesn't propagate the
          # compiler to that sub-build, so force Ninja (cl is on PATH via the
          # MSVC dev-env step). CL=/FS serializes PDB writes under parallelism.
          CMAKE_GENERATOR: Ninja
          CL: /FS
          # whisper.cpp's CMake auto-detects the ccache the runner ships and
          # wraps the compiler with it. On the hosted runner those wrapped
          # invocations return phantom cache *hits* — "success" without writing
          # the .obj — so the ggml-base.lib link can't open ggml.c.obj (LNK1181).
          # Disable ccache so every object is compiled and written fresh.
          CCACHE_DISABLE: '1'
        # Portable GPU build for BOTH subsystems:
        #  - `stt-vulkan` — whisper.cpp's Vulkan backend (only runtime dep is the
        #    system vulkan-1.dll; needs the Vulkan SDK + MSVC dev-env at build).
        #  - `tts-webgpu` — Kokoro on ONNX Runtime's WebGPU EP (Dawn-backed). A
        #    PREBUILT, so it needs NO Vulkan SDK / Ninja; its runtime deps are the
        #    bundled Dawn dylibs staged below. ~5x faster than CPU and works where
        #    CUDA can't (incl. Blackwell) — see docs/features/FEATURE-tts-webgpu.md.
        # Both run on any GPU vendor and fall back to CPU when none is present.
        # Default is CPU-only, so these flags are what ship GPU in the zip.
        # (VULKAN_SDK is set by the Install Vulkan SDK step. CARGO_TARGET_DIR=C:\b
        # is job-level.) NOTE: tts-webgpu and tts-cuda are mutually exclusive.
        run: |
          npm run tauri build -- --no-bundle --features stt-vulkan,tts-webgpu

      - name: Stage portable layouts (full + no-models)
        shell: pwsh
        run: |
          $stageFull = "${{ steps.tag.outputs.stage_dir_full }}"
          $stageSlim = "${{ steps.tag.outputs.stage_dir_slim }}"

          # --- Full variant (with model + default voicepack) ---------------
          New-Item -ItemType Directory -Force -Path "$stageFull/bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stageFull/models/voices" | Out-Null

          # cimp.exe + ORT runtime DLLs (the `ort` crate's download-binaries
          # feature drops these into target/release at build time). With the
          # tts-webgpu prebuilt the core ONNX Runtime is static-linked into
          # cimp.exe, so this glob usually matches nothing today — kept for
          # forward-compat in case ort ships a dynamic onnxruntime.dll again.
          Copy-Item $env:CARGO_TARGET_DIR/release/cimp.exe "$stageFull/bin/"
          Get-ChildItem $env:CARGO_TARGET_DIR/release -Filter 'onnxruntime*.dll' |
            ForEach-Object { Copy-Item $_.FullName "$stageFull/bin/" }

          # WebGPU EP (tts-webgpu) runtime: the Dawn backend + the DirectX shader
          # compiler it uses for D3D12. copy-dylibs drops these next to the exe.
          # All three are REQUIRED for GPU TTS — without them the WebGPU EP fails
          # to init and TTS silently falls back to CPU. Fail the build if missing
          # so a broken GPU zip never ships.
          foreach ($d in @('webgpu_dawn.dll','dxcompiler.dll','dxil.dll')) {
            $src = "$env:CARGO_TARGET_DIR/release/$d"
            if (Test-Path $src) { Copy-Item $src "$stageFull/bin/" }
            else { Write-Host "::error::WebGPU runtime DLL missing from build output: $d"; exit 1 }
          }

          # Prompt-detection patterns. Ships next to cimp.exe (the loader
          # reads <exe-dir>/patterns.json) so it's present and editable on a
          # fresh install instead of only appearing after first run. Source
          # of truth is scripts/patterns.default.json, kept in sync with the
          # code defaults by a unit test. Full zip only — the no-models
          # update zip omits it so re-extracting an update never clobbers a
          # user's hand-edited patterns.
          Copy-Item scripts/patterns.default.json "$stageFull/bin/patterns.json"

          # UI themes + terminal palettes. Ship next to cimp.exe (the loader
          # reads <exe-dir>/themes/ and <exe-dir>/palettes/) so the full theme
          # set is present and editable on a fresh install — nothing is embedded
          # in the binary or seeded at runtime. Source of truth is the repo-root
          # themes/ and palettes/ folders (the same ones build.rs copies next to
          # the dev exe). Copied recursively to preserve the per-theme subfolders.
          New-Item -ItemType Directory -Force -Path "$stageFull/bin/themes" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stageFull/bin/palettes" | Out-Null
          Copy-Item -Recurse themes/* "$stageFull/bin/themes/"
          Copy-Item -Recurse palettes/* "$stageFull/bin/palettes/"

          # Kokoro ONNX model and every voicepack, fetched from the
          # models-v1 release by the fetch step. Shipping all voices means
          # the user can switch via Settings -> Audio without re-downloading
          # anything; the voicepacks are ~512 KB each so the cost is small.
          Copy-Item models/kokoro-v1.0.onnx "$stageFull/models/"
          Copy-Item models/voices/*.bin "$stageFull/models/voices/"

          # V6-01: bundled offline STT (Whisper) model, also from the
          # models-v1 release. Full zip only — the slim/no-models zip is
          # untouched so a no-models update never clobbers a user's local
          # ggml-*.bin. Guarded so a release can ship before the blob is
          # listed in CHECKSUMS.txt (STT just degrades to "model not found"
          # until the user drops one in).
          if (Test-Path models/ggml-small.bin) {
            Copy-Item models/ggml-small.bin "$stageFull/models/"
          } else {
            Write-Host "::warning::models/ggml-small.bin not present; full zip ships without the STT model"
          }

          # Avatar videos: ship the canonical set as discoverable on-disk
          # files for users who want to customize. Source of truth is the
          # top-level `avatars/` folder — the same files the Vite plugin
          # bundles into the embedded frontend at build time. Users
          # override per state via Settings -> Avatar by pointing at the
          # matching file in this folder (or any other on disk). The
          # bundled defaults are theme-keyed under per-theme subfolders,
          # so we copy recursively to preserve the layout.
          New-Item -ItemType Directory -Force -Path "$stageFull/avatars" | Out-Null
          Copy-Item -Recurse avatars/* "$stageFull/avatars/"

          # Sprite avatar sets: the manifest-driven pixel-art mascot variant.
          # Mirrors the `avatars/` staging — source of truth is the top-level
          # `sprites/<set>/` tree the `cimp-sprites` Vite plugin embeds into
          # the frontend. Staged on-disk too for discoverability / adding sets.
          New-Item -ItemType Directory -Force -Path "$stageFull/sprites" | Out-Null
          Copy-Item -Recurse sprites/* "$stageFull/sprites/"

          # Top-level docs
          Copy-Item LICENSE "$stageFull/"
          Copy-Item NOTICE "$stageFull/"
          Copy-Item scripts/portable-readme.txt "$stageFull/README.txt"

          # --- Slim variant (no Kokoro model, no voicepack) ----------------
          # Same exe + DLLs as the full build. Skip `models/` entirely so a
          # user extracting this zip over an existing install keeps their
          # local model files untouched. The `avatars/` and `sprites/` folders
          # are omitted too: those are only on-disk copies for customization —
          # the canonical sets are embedded in the frontend at build time by
          # the Vite plugins, so the app still renders avatars and sprites
          # without them. Leaving them out keeps the no-models update zip lean.
          New-Item -ItemType Directory -Force -Path "$stageSlim/bin" | Out-Null

          Copy-Item $env:CARGO_TARGET_DIR/release/cimp.exe "$stageSlim/bin/"
          Get-ChildItem $env:CARGO_TARGET_DIR/release -Filter 'onnxruntime*.dll' |
            ForEach-Object { Copy-Item $_.FullName "$stageSlim/bin/" }

          # WebGPU EP (tts-webgpu) runtime DLLs — same set as the full variant
          # (see that block's note). Required for GPU TTS; fail if missing.
          foreach ($d in @('webgpu_dawn.dll','dxcompiler.dll','dxil.dll')) {
            $src = "$env:CARGO_TARGET_DIR/release/$d"
            if (Test-Path $src) { Copy-Item $src "$stageSlim/bin/" }
            else { Write-Host "::error::WebGPU runtime DLL missing from build output: $d"; exit 1 }
          }

          # UI themes + terminal palettes (see the full-variant note). Bundled
          # in the slim zip too so the app is themed after a no-models update;
          # like avatars/sprites these are default assets, not hand-edited
          # config, so re-extracting refreshing them is fine.
          New-Item -ItemType Directory -Force -Path "$stageSlim/bin/themes" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stageSlim/bin/palettes" | Out-Null
          Copy-Item -Recurse themes/* "$stageSlim/bin/themes/"
          Copy-Item -Recurse palettes/* "$stageSlim/bin/palettes/"

          Copy-Item LICENSE "$stageSlim/"
          Copy-Item NOTICE "$stageSlim/"
          Copy-Item scripts/portable-readme-no-models.txt "$stageSlim/README.txt"

          Write-Host "Staged FULL contents:"
          Get-ChildItem -Recurse $stageFull | Select-Object FullName, Length |
            Format-Table -AutoSize | Out-String | Write-Host
          Write-Host "Staged SLIM contents:"
          Get-ChildItem -Recurse $stageSlim | Select-Object FullName, Length |
            Format-Table -AutoSize | Out-String | Write-Host

      - name: Stage bundled tools into ebin (both variants)
        shell: pwsh
        env:
          # Pinned for reproducible releases. Bump these to ship newer tools.
          BROOT_VERSION: '1.57.0'      # Canop/broot — MIT
          RUSTNET_VERSION: '1.4.0'     # domcyrus/rustnet — Apache-2.0
        run: |
          $stageFull = "${{ steps.tag.outputs.stage_dir_full }}"
          $stageSlim = "${{ steps.tag.outputs.stage_dir_slim }}"

          # The portable layout carries an `ebin/` (external binaries) folder as
          # a sibling of `bin/`. cImp resolves these tools from ebin first, then
          # PATH — see src-tauri/src/pty/resolve.rs. Tools are downloaded here at
          # release time rather than committed (large, separately licensed). Both
          # the full and slim/update zips get them so the toolset survives a
          # no-models update.
          $ebinFull = "$stageFull/ebin"
          $ebinSlim = "$stageSlim/ebin"
          New-Item -ItemType Directory -Force -Path $ebinFull | Out-Null
          New-Item -ItemType Directory -Force -Path $ebinSlim | Out-Null

          $work = Join-Path $env:RUNNER_TEMP 'ebin-tools'
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          function Stage-Tool($name, $url, $exeName, $matchHint) {
            Write-Host "Fetching $name from $url"
            $zip = Join-Path $work "$name.zip"
            curl.exe -L --fail -o $zip $url
            $dest = Join-Path $work $name
            Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
            Expand-Archive -Path $zip -DestinationPath $dest -Force
            # Some release zips carry every platform's build; pick the Windows
            # one by filename + (optional) path hint.
            $exe = Get-ChildItem -Recurse -Path $dest -Filter $exeName |
              Where-Object { -not $matchHint -or $_.FullName -match $matchHint } |
              Select-Object -First 1
            if (-not $exe) {
              Write-Host "::error::$exeName not found in $name archive"; exit 1
            }
            Copy-Item $exe.FullName "$ebinFull/$exeName"
            Copy-Item $exe.FullName "$ebinSlim/$exeName"
            Write-Host "Staged $exeName ($([math]::Round($exe.Length/1KB)) KB)"
          }

          # broot — MIT. The release zip bundles all platforms; the Windows build
          # lives under an x86_64-pc-windows-* subdir.
          Stage-Tool 'broot' `
            "https://github.com/Canop/broot/releases/download/v$env:BROOT_VERSION/broot_$env:BROOT_VERSION.zip" `
            'broot.exe' 'windows'

          # rustnet — Apache-2.0. NOTE: capturing packets needs Npcap installed
          # on the user's machine (WinPcap API-compatible mode); see README.txt.
          Stage-Tool 'rustnet' `
            "https://github.com/domcyrus/rustnet/releases/download/v$env:RUSTNET_VERSION/rustnet-v$env:RUSTNET_VERSION-x86_64-pc-windows-msvc.zip" `
            'rustnet.exe' $null

          # aider is intentionally NOT bundled: pip's aider.exe is a launcher
          # that hardcodes the install machine's Python path, so it isn't
          # portable. Users who want it can drop a working aider into ebin/
          # (cImp resolves it automatically); see README.txt.

          Write-Host "Staged ebin (full):"
          Get-ChildItem $ebinFull | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: Zip both variants
        id: zip
        shell: pwsh
        run: |
          $stageFull = "${{ steps.tag.outputs.stage_dir_full }}"
          $stageSlim = "${{ steps.tag.outputs.stage_dir_slim }}"
          $zipFull = "$stageFull.zip"
          $zipSlim = "$stageSlim.zip"

          Compress-Archive -Path $stageFull -DestinationPath $zipFull -CompressionLevel Optimal
          Compress-Archive -Path $stageSlim -DestinationPath $zipSlim -CompressionLevel Optimal

          $shaFull = (Get-FileHash -Algorithm SHA256 $zipFull).Hash.ToLower()
          $shaSlim = (Get-FileHash -Algorithm SHA256 $zipSlim).Hash.ToLower()
          $sizeFull = (Get-Item $zipFull).Length
          $sizeSlim = (Get-Item $zipSlim).Length

          Write-Host "full zip: $zipFull ($sizeFull bytes)"
          Write-Host "  sha256: $shaFull"
          Write-Host "slim zip: $zipSlim ($sizeSlim bytes)"
          Write-Host "  sha256: $shaSlim"

          "zip_full=$zipFull" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "zip_slim=$zipSlim" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha_full=$shaFull" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha_slim=$shaSlim" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build release notes (CHANGELOG section if present, else autogen)
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          version="${{ steps.tag.outputs.version }}"
          tag="${{ steps.tag.outputs.tag }}"
          out=release-notes.md

          if grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "found CHANGELOG section for $version"
            # Match the heading as a literal prefix rather than a regex:
            # the previous `$0 ~ "^## \\[" ver "\\]"` form had gawk treat
            # `\[`/`\]` as character classes (not literal brackets), so the
            # section was never matched and the notes came out empty.
            awk -v hdr="## [$version]" '
              index($0, hdr) == 1 { found=1; print; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "$out"
          else
            echo "no CHANGELOG.md section for $version — using gh-generated notes"
            # `gh api` returns JSON; pluck the .body. Use the previous tag if
            # we can find one, otherwise let GitHub pick.
            prev_tag=$(git tag --sort=-v:refname | grep -v "^$tag$" | head -n1 || true)
            if [ -n "$prev_tag" ]; then
              gh api repos/${{ github.repository }}/releases/generate-notes \
                -f tag_name="$tag" \
                -f previous_tag_name="$prev_tag" \
                -q .body > "$out" || echo "(release notes for $tag)" > "$out"
            else
              gh api repos/${{ github.repository }}/releases/generate-notes \
                -f tag_name="$tag" \
                -q .body > "$out" || echo "(release notes for $tag)" > "$out"
            fi
          fi

          {
            echo ""
            echo "---"
            echo ""
            echo "**Portable zip SHA-256 (full, with models):** \`${{ steps.zip.outputs.sha_full }}\`"
            echo ""
            echo "**Portable zip SHA-256 (no-models, update zip):** \`${{ steps.zip.outputs.sha_slim }}\`"
          } >> "$out"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          tag="${{ steps.tag.outputs.tag }}"
          zip_full="${{ steps.zip.outputs.zip_full }}"
          zip_slim="${{ steps.zip.outputs.zip_slim }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists — refreshing notes and uploading both assets"
            gh release edit "$tag" --notes-file release-notes.md
            gh release upload "$tag" "$zip_full" "$zip_slim" --clobber
          else
            gh release create "$tag" "$zip_full" "$zip_slim" \
              --title "$tag" \
              --notes-file release-notes.md
          fi

  # Portable Linux x86-64 tarball. Runs AFTER build-windows (which creates the
  # GitHub release) and uploads its tarballs to the same tag.
  #
  # Runner is ubuntu-24.04 (NOT ubuntu-latest / 22.04): the released binary's
  # glibc/libstdc++ floor is set by ort's WebGPU prebuilt (a static
  # libonnxruntime built against glibc >= 2.38 / GCC 13+), which 22.04 cannot
  # link or run. So 24.04 is the build AND runtime floor for GPU parity. See
  # docs/MILESTONE-linux-support.md.
  build-linux:
    needs: build-windows
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      tag: ${{ needs.build-windows.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-windows.outputs.tag }}

      # Same models cache + fetch as build-windows (see the comment there).
      # build-windows runs first and populates the cache, so this is
      # normally a pure cache hit with zero downloads.
      - name: Restore models cache
        uses: actions/cache@v4
        with:
          path: |
            models/kokoro-v1.0.onnx
            models/ggml-small.bin
            models/voices/*.bin
          key: models-${{ hashFiles('models/CHECKSUMS.txt') }}
          enableCrossOsArchive: true
          restore-keys: |
            models-

      - name: Fetch + verify models
        shell: pwsh
        run: ./scripts/fetch-models.ps1

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          # Tauri v2 (webkit2gtk-4.1 + libsoup3 + gtk3 + appindicator), audio
          # (ALSA for cpal/rodio), the espeak-ng-sys/whisper-rs bindgen +
          # cmake/clang toolchain, Vulkan (whisper stt-vulkan) and libssl-dev
          # (build-time only: ort-sys' downloader uses ureq -> native-tls ->
          # openssl on Linux; it does NOT link into the shipped binary).
          # espeak-ng-data supplies the compiled phoneme tables build.rs bundles
          # (espeak-rs-sys builds only the lib on Linux, not the data).
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev build-essential pkg-config file \
            libasound2-dev cmake clang libclang-dev llvm \
            libvulkan-dev glslang-tools spirv-tools mesa-vulkan-drivers \
            libssl-dev espeak-ng-data unzip

      - name: Install recent Vulkan headers + glslc (LunarG SDK repo)
        shell: bash
        run: |
          set -e
          # Ubuntu 24.04's Vulkan headers/glslc are too old for whisper.cpp's
          # ggml-vulkan (needs VK_EXT_layer_settings / cooperative-matrix KHR /
          # etc.), and Ubuntu ships no `glslc` at all. The LunarG apt repo
          # provides both. (Linux analog of the Windows job's Vulkan SDK install.)
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update -qq
          sudo apt-get install -y vulkan-headers libvulkan-dev shaderc
          glslc --version | head -1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Tauri build (release, GPU parity)
        shell: bash
        env:
          # ort's WebGPU EP (Dawn->Vulkan on Linux) + whisper.cpp's Vulkan
          # backend — the portable, vendor-agnostic GPU path (falls back to CPU
          # when no usable GPU). Mirrors the Windows job's stt-vulkan,tts-webgpu.
          FEATURES: stt-vulkan,tts-webgpu
        run: |
          set -e
          # bindgen (whisper-rs-sys, espeak-rs-sys) needs libclang; find it
          # regardless of the runner's LLVM version.
          export LIBCLANG_PATH="$(dirname "$(find /usr/lib/llvm-* -name libclang.so 2>/dev/null | sort | tail -1)")"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH"
          npm run tauri build -- --no-bundle --features "$FEATURES"

      - name: Stage portable layouts (full + no-models)
        shell: bash
        run: |
          set -e
          rel="src-tauri/target/release"
          stageFull="cimp-portable-linux-x64-$tag"
          stageSlim="cimp-portable-linux-x64-$tag-no-models"

          # --- Full variant --------------------------------------------------
          mkdir -p "$stageFull/bin" "$stageFull/models/voices"

          cp "$rel/cimp" "$stageFull/bin/"

          # ort's WebGPU runtime dylib (Dawn). REQUIRED — without it the WebGPU
          # EP can't init and TTS silently falls back to CPU. The binary carries
          # an $ORIGIN rpath (build.rs) so it's found next to cimp. Deref the
          # symlink ort leaves in target/release. Fail the build if missing.
          if [ -f "$rel/libwebgpu_dawn.so" ]; then
            cp -L "$rel/libwebgpu_dawn.so" "$stageFull/bin/"
          else
            echo "::error::libwebgpu_dawn.so missing from build output"; exit 1
          fi

          # Compiled espeak-ng phoneme data (build.rs copies it next to the
          # binary from the system espeak-ng-data pkg). Bundling makes the OOV
          # fallback work without the user apt-installing anything.
          if [ -d "$rel/espeak-ng-data" ]; then
            cp -r "$rel/espeak-ng-data" "$stageFull/bin/"
          else
            echo "::warning::espeak-ng-data not next to binary; OOV fallback unavailable"
          fi

          # Prompt-detection patterns (full zip only, like Windows).
          cp scripts/patterns.default.json "$stageFull/bin/patterns.json"

          # UI themes + terminal palettes.
          cp -r themes "$stageFull/bin/themes"
          cp -r palettes "$stageFull/bin/palettes"

          # Kokoro model + all voicepacks + Whisper STT model (fetched from
          # the models-v1 release by the fetch step).
          cp models/kokoro-v1.0.onnx "$stageFull/models/"
          cp models/voices/*.bin "$stageFull/models/voices/"
          if [ -f models/ggml-small.bin ]; then
            cp models/ggml-small.bin "$stageFull/models/"
          else
            echo "::warning::models/ggml-small.bin absent; full tarball ships without the STT model"
          fi

          # Avatar videos + sprite sets (discoverable on-disk copies).
          cp -r avatars "$stageFull/avatars"
          cp -r sprites "$stageFull/sprites"

          cp LICENSE NOTICE "$stageFull/"
          cp scripts/portable-readme-linux.txt "$stageFull/README.txt"

          # --- Slim variant (no models/avatars/sprites, keep binary+libs) ----
          mkdir -p "$stageSlim/bin"
          cp "$rel/cimp" "$stageSlim/bin/"
          cp -L "$rel/libwebgpu_dawn.so" "$stageSlim/bin/"
          [ -d "$rel/espeak-ng-data" ] && cp -r "$rel/espeak-ng-data" "$stageSlim/bin/"
          cp -r themes "$stageSlim/bin/themes"
          cp -r palettes "$stageSlim/bin/palettes"
          cp LICENSE NOTICE "$stageSlim/"
          cp scripts/portable-readme-linux.txt "$stageSlim/README.txt"

      - name: Stage bundled tools into ebin (both variants)
        shell: bash
        env:
          BROOT_VERSION: '1.57.0'      # Canop/broot — MIT
          RUSTNET_VERSION: '1.4.0'     # domcyrus/rustnet — Apache-2.0
        run: |
          set -e
          stageFull="cimp-portable-linux-x64-$tag"
          stageSlim="cimp-portable-linux-x64-$tag-no-models"
          work="$RUNNER_TEMP/ebin"
          mkdir -p "$work" "$stageFull/ebin" "$stageSlim/ebin"

          # broot — its release zip bundles every platform; pick the static
          # musl Linux build.
          curl -L --fail -o "$work/broot.zip" \
            "https://github.com/Canop/broot/releases/download/v$BROOT_VERSION/broot_$BROOT_VERSION.zip"
          unzip -q -o "$work/broot.zip" -d "$work/broot"
          broot_bin="$(find "$work/broot" -type f -name broot -path '*x86_64-unknown-linux-musl*' | head -1)"
          [ -n "$broot_bin" ] || { echo "::error::linux broot not found in archive"; exit 1; }
          install -m755 "$broot_bin" "$stageFull/ebin/broot"
          install -m755 "$broot_bin" "$stageSlim/ebin/broot"

          # rustnet — static musl tarball. (Packet capture needs
          # `setcap cap_net_raw+ep ./ebin/rustnet` on the user's machine; see
          # README.txt.)
          curl -L --fail -o "$work/rustnet.tgz" \
            "https://github.com/domcyrus/rustnet/releases/download/v$RUSTNET_VERSION/rustnet-v$RUSTNET_VERSION-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf "$work/rustnet.tgz" -C "$work"
          rustnet_bin="$(find "$work" -type f -name rustnet | head -1)"
          [ -n "$rustnet_bin" ] || { echo "::error::rustnet binary not found in archive"; exit 1; }
          install -m755 "$rustnet_bin" "$stageFull/ebin/rustnet"
          install -m755 "$rustnet_bin" "$stageSlim/ebin/rustnet"

      - name: Tar both variants
        id: tar
        shell: bash
        run: |
          set -e
          stageFull="cimp-portable-linux-x64-$tag"
          stageSlim="cimp-portable-linux-x64-$tag-no-models"
          tar -czf "$stageFull.tar.gz" "$stageFull"
          tar -czf "$stageSlim.tar.gz" "$stageSlim"
          shaFull=$(sha256sum "$stageFull.tar.gz" | cut -d' ' -f1)
          shaSlim=$(sha256sum "$stageSlim.tar.gz" | cut -d' ' -f1)
          echo "full=$stageFull.tar.gz" >> "$GITHUB_OUTPUT"
          echo "slim=$stageSlim.tar.gz" >> "$GITHUB_OUTPUT"
          echo "tarball SHA-256 (full):  $shaFull"
          echo "tarball SHA-256 (slim):  $shaSlim"

      - name: Upload Linux tarballs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          gh release upload "$tag" \
            "${{ steps.tar.outputs.full }}" "${{ steps.tar.outputs.slim }}" --clobber
