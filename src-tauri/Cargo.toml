[package]
name = "cctts"
version = "0.9.2"
description = "Claude Code wrapper with TTS, avatar, and compose overlay"
authors = ["Amir Amashe"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "cctts"
path = "src/main.rs"

[features]
# GPU-accelerated STT: compiles whisper.cpp's CUDA backend. ON BY DEFAULT so
# local builds use the GPU (with automatic CPU fallback at runtime — see
# stt/engine.rs). Needs the CUDA toolkit at build time (CUDA 13.2 here; see
# .cargo/config.toml) and CUDA 13.2's bin on PATH to run. Portable / CI builds
# that must run without CUDA use `--no-default-features` for a CPU-only binary.
default = ["stt-cuda"]
stt-cuda = ["whisper-rs/cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
portable-pty = "0.8"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
base64 = "0.22"
which = "6"
vte = "0.13"
shlex = "1"
uuid = { version = "1", features = ["v4"] }

# Claude Code usage tracker: GETs the undocumented oauth/usage endpoint.
# rustls-tls keeps TLS pure-Rust (no system OpenSSL) for the single-binary build.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# System-monitor panel (CPU / memory / network). Pure-Rust, no admin.
sysinfo = { version = "0.36", default-features = false, features = ["system", "network"] }
# NVIDIA GPU stats (utilization / memory / temperature). Loads nvml.dll at
# runtime; absent driver → GPU section degrades to n/a.
nvml-wrapper = "0.12"

# TTS (Kokoro via ONNX Runtime). misaki-rs default features include espeak-ng
# fallback for OOV words; the resulting binary is GPLv3 (see NOTICE).
misaki-rs = "0.3"
ort = { version = "=2.0.0-rc.11", features = ["download-binaries", "cuda"] }
ndarray = "0.16"
bytemuck = "1"

# Audio output
cpal = "0.15"
rodio = "0.20"

# STT (Whisper via whisper.cpp bindings). Statically links one C library;
# needs a C/C++ toolchain + CMake at build time (see MAINTENANCE.md). CUDA is
# a compile-time feature (`stt-cuda`) wired to the same CCTTS_GPU=cuda runtime
# opt-in as ort — see [features] below. Default build is CPU-only so it works
# on any machine without the CUDA toolkit.
whisper-rs = "0.16"
# Native-rate -> 16 kHz mono resampling of captured mic audio for Whisper.
rubato = "0.16"

# Windows-only: registry probe for Git Bash auto-detection in shell::detect.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
